# CI only -- deliberately no CD/deploy job in this workflow. E1 has no
# server to deploy to yet; deployment automation is stage E6 (spec 16.2).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: api
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Unit tests
        run: go test ./...
      - name: Integration tests (real Postgres/Redis via testcontainers)
        run: go test -tags=integration ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
      - name: Build image for scanning
        run: docker build -t vocalcoach-api:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vocalcoach-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r sha; do
            msg="$(git log -1 --format=%B "$sha")"
            if echo "$msg" | grep -qiE 'co-authored-by:.*(claude|copilot|gpt|gemini|assistant|bot)|generated (with|by)|ai-(assisted|generated)'; then
              echo "::error::commit $sha carries a disallowed attribution trailer"
              fail=1
            fi
            subject="$(echo "$msg" | head -1)"
            if ! echo "$subject" | grep -qE '^(feat|fix|refactor|perf|test|docs|build|ci|chore)(\([a-z-]+\))?: .{1,72}$'; then
              echo "::error::commit $sha subject '$subject' does not match '<type>(<scope>): <subject>'"
              fail=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$fail"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build go-api image
        run: docker build -t vocalcoach-api:ci .

  lint-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck
      - name: eslint
        run: npm run lint
      - name: prettier
        run: npm run format
      - name: openapi.yaml -> src/api/schema.gen.ts is up to date
        run: |
          npm run generate:api
          npx prettier --write src/api/schema.gen.ts
          git diff --exit-code -- src/api/schema.gen.ts

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  security-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  lint-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy .

  test-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vocalcoach
          POSTGRES_USER: vocalcoach
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocalcoach -d vocalcoach"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Apply migrations (schema the worker's repositories read/write)
        working-directory: api
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 postgres \
            "host=localhost port=5432 dbname=vocalcoach user=vocalcoach password=testpass sslmode=disable" \
            -dir migrations up
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --all-groups
      - name: Unit tests
        run: uv run pytest -m "not integration"
      - name: Integration tests (real Postgres/Redis)
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: "5432"
          TEST_POSTGRES_DB: vocalcoach
          TEST_POSTGRES_USER: vocalcoach
          TEST_POSTGRES_PASSWORD: testpass
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: "6379"
          TEST_REDIS_PASSWORD: ""
        run: uv run pytest -m integration

  security-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --all-groups
      - name: pip-audit
        run: uv run --with pip-audit pip-audit
      - name: Build image for scanning
        run: docker build -t vocalcoach-worker:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vocalcoach-worker:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          # worker/Dockerfile pins Debian trixie specifically because it
          # trails fewer unpatched CVEs than bookworm, but even trixie's
          # base packages (ffmpeg, glib, libxml2, perl, ...) still have
          # some CRITICAL/HIGH findings with no Debian package build yet
          # as of this writing -- Trivy reports them as affected/
          # fix_deferred/will_not_fix with an empty "Fixed Version", not
          # something a dependency bump here can resolve. Blocking every
          # merge on upstream's timeline defeats the scan's purpose;
          # ignore-unfixed keeps it blocking on the CVEs it's actually
          # possible to act on. Revisit if this ever needs finer-grained
          # exceptions (a .trivyignore) instead of the blanket flag.
          ignore-unfixed: "true"

  build-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Build python-worker image
        run: docker build -t vocalcoach-worker:ci .
