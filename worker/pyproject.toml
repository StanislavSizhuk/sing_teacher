[project]
name = "vocalcoach-worker"
version = "0.1.0"
description = "AI Vocal Coach ML pipeline worker (spec 6, stage E3)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "librosa>=0.10.2,<0.11",
    "soundfile>=0.12.1,<0.13",
    "pyloudnorm>=0.1.1,<0.2",
    "redis>=5.2,<6",
    "psycopg[binary]>=3.2,<4",
    "torch>=2.5,<3",
    "torchaudio>=2.5,<3",
    "demucs>=4.0.1,<5",
    # CTranslate2 int8 runtime, not openai-whisper's own inference (spec
    # 5.1/ADR-0021): same Whisper models, substantially faster and lighter
    # on CPU at the same accuracy -- a runtime swap, not a model swap.
    "faster-whisper>=1.0,<2",
    "torchcrepe>=0.0.23,<0.1",
    # Used directly for the banded DTW (spec 6.7, dsp/dtw.py), not just a
    # transitive pin anymore -- openai-whisper's own pin still resolves to a
    # numba too old to build on Python 3.12 (llvmlite 0.36 has no py312
    # wheel), so this also forces a modern one every dependent is fine with.
    "numba>=0.60,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pytest>=9.0.3,<10",  # >=9.0.3: PYSEC-2026-1845 fixed here, pip-audit flags earlier 8.x/9.x
    "pytest-cov>=6.0,<7",
]

# CPU-only torch: the worker is a single CPU-only replica (spec 5.1, NFR-04);
# CUDA wheels would only bloat the image and CI install time for nothing.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalcoach"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting is exactly what plain `assert` is for; S101
# is only meaningful for asserts on the request path (api/ has no such rule
# to mirror since Go has no assert at all).
"tests/**" = ["S101"]
# ADR-0031: this file's Ukrainian phrase templates are made almost entirely
# of Cyrillic letters RUF001 considers "confusable" with a Latin lookalike
# (а/a, е/e, і/i, о/o, р/p, с/c, у/y, х/x, ...) -- real orthography, not a
# homoglyph slipped into otherwise-Latin text, which is what RUF001 guards
# against elsewhere.
"src/vocalcoach/pipeline/report.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["vocalcoach", "tests"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

# Third-party audio/ML libraries ship no type stubs (upstream, not our code);
# spec 12.3 asks for a comment on every mypy exception -- this is that comment
# for the whole batch instead of a `# type: ignore` sprinkled through the code.
[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "soundfile.*",
    "pyloudnorm.*",
    "demucs.*",
    "faster_whisper.*",
    "torchcrepe.*",
    "scipy.*",
]
ignore_missing_imports = true

# Full strict mode fights pytest's own conventions (fixtures injected by
# parameter name, generator fixtures typed as their yielded value, small
# local helper functions) for no correctness benefit -- the product code
# under test in src/ is where strict typing earns its keep (spec 12.3).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." (this directory, worker/) makes `from tests.conftest import ...` /
# `from tests.helpers import ...` resolve `tests` as a package -- pytest's
# default import mode only adds tests/ itself to sys.path (no
# tests/__init__.py), not its parent. Worked locally under `python -m
# pytest` only because `-m` itself prepends the cwd to sys.path; `uv run
# pytest` (what CI actually runs) does not do that.
pythonpath = ["src", "."]
markers = [
    "integration: needs a real Postgres/Redis (CI runs these separately from unit tests)",
]
