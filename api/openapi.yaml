openapi: 3.1.0
info:
  title: AI Vocal Coach API
  version: "1.0.0"
  summary: >
    Auth/account (E1), song upload/YouTube import/analysis queue (E2),
    per-aspect scores/report/piano-roll (E4) and the progress-over-time
    chart (E5, FR-35). A paginated /analyses history endpoint (FR-34) is
    not yet built.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: registerWithEmail
      summary: Register with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: >
            Accepted. The response never reveals whether the email was
            already registered (spec 9.1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/verify:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with its 6-digit code
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Code invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/verify/resend:
    post:
      operationId: resendVerificationCode
      summary: Resend the verification code (max 1/60s, 5/day)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendRequest"
      responses:
        "200":
          description: Sent, if the account exists and is unverified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >
            Authenticated. Sets the refresh token as an httpOnly cookie
            scoped to /api/v1/auth; the response body carries only the
            access token.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Invalid credentials, or correct password but email not verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and mint a new access token
      tags: [auth]
      security:
        - refreshCookie: []
      responses:
        "200":
          description: New access token issued; refresh cookie rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Refresh token missing, expired, or reused (forces re-login).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Log out of the current session
      tags: [auth]
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Logged out; refresh cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/google:
    get:
      operationId: startGoogleLogin
      summary: Start the Google OAuth2/PKCE flow
      tags: [auth]
      security: []
      responses:
        "302":
          description: Redirect to Google's consent screen.

  /auth/google/callback:
    get:
      operationId: googleLoginCallback
      summary: Google OAuth2 callback
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect to APP_BASE_URL with the refresh cookie set. The access
            token is never placed in the URL; the frontend calls
            /auth/refresh on load to mint its first one.
        "400":
          description: OAuth state mismatch or missing PKCE cookies.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me:
    get:
      operationId: getProfile
      summary: Get the authenticated user's profile
      tags: [account]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteAccount
      summary: Delete the authenticated user's account and all their data
      tags: [account]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account and every session revoked; cascades to owned data.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /songs:
    post:
      operationId: addSong
      summary: Add a song by file upload or YouTube link (FR-10, FR-11)
      tags: [songs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AddSongRequest"
      responses:
        "201":
          description: >
            Song ready to reference. `reused: true` means an identical song
            (by content hash / YouTube video id) already existed and this
            upload was deduplicated (spec 6.6, FR-13).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: YouTube import is disabled (spec 11.4).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Audio exceeds MAX_UPLOAD_MB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /songs/{id}:
    get:
      operationId: getSong
      summary: Get a song's reference preparation status (FR-14)
      tags: [songs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The song.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No song with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /analyses:
    post:
      operationId: enqueueAnalysis
      summary: Put a recording in the analysis queue (FR-22)
      tags: [analyses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EnqueueAnalysisRequest"
      responses:
        "202":
          description: Queued. Position updates follow over the WebSocket channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Recording exceeds MAX_UPLOAD_MB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /analyses/{id}:
    get:
      operationId: getAnalysis
      summary: Get an analysis's current status, scoped to its owner
      tags: [analyses]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No analysis with this id owned by the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /analyses/{id}/cancel:
    post:
      operationId: cancelAnalysis
      summary: Cancel an analysis while it is still queued (FR-25)
      tags: [analyses]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No analysis with this id owned by the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The analysis is no longer queued (`ANALYSIS_NOT_QUEUED`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /analyses/{id}/retry:
    post:
      operationId: retryAnalysis
      summary: Restart a failed analysis without re-uploading the recording (FR-26)
      tags: [analyses]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Re-queued. Position updates follow over the WebSocket channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No analysis with this id owned by the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The analysis is not in the failed state (`ANALYSIS_NOT_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ws/analyses/{id}:
    get:
      operationId: watchAnalysisQueuePosition
      summary: WebSocket status channel for one analysis (spec 8.3)
      description: >
        Upgrades to a WebSocket. The client's first message must be
        `{"token": "<access_token>"}` (never a query parameter, so it never
        lands in proxy logs); the server then pushes one JSON event per
        status change, each with a `type` field: `{"type": "queued",
        "position": N}` while queued; `{"type": "stage", "name": "pitch",
        "index": 5, "total": 10}` once the E3 worker picks the job up, one
        push per stage started; `{"type": "done", "analysis_id": "..."}` on
        success; `{"type": "failed", "error_code": "...", "message": "..."}`
        on failure (spec 6.8 error codes). `stage`/`done`/`failed` events
        are relayed from the worker over Redis Pub/Sub (ADR-0010) and are
        best-effort -- WebSocket is a status-only transport, the final
        result is always read back over REST (fallback to polling
        GET /analyses/{id} if the socket drops or an event is missed).
      tags: [analyses]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: Switching Protocols to WebSocket.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /progress:
    get:
      operationId: getProgress
      summary: Get the caller's overall_score points for the progress chart (FR-35)
      description: >
        Every completed analysis's overall_score, oldest first (spec 7's
        progress_snapshots, written by the E3 worker once stage 11
        succeeds). Not cursor-paginated like a browsable list (spec 8.1):
        this feeds a chart in one call rather than something a user pages
        through, so the server caps it at a fixed size instead.
      tags: [progress]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's progress points.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /healthz:
    servers:
      - url: /
    get:
      operationId: healthz
      summary: Liveness probe
      tags: [ops]
      security: []
      responses:
        "200":
          description: Process is up.

  /readyz:
    servers:
      - url: /
    get:
      operationId: readyz
      summary: Readiness probe (Postgres + Redis reachable)
      tags: [ops]
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
        "503":
          description: A dependency is unavailable.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit or lockout in effect.
      headers:
        Retry-After:
          schema:
            type: integer
            description: Seconds until the next attempt may succeed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 256
          description: Rejected if under 10 characters or one of the most common passwords.
        display_name:
          type: string
          minLength: 1
          maxLength: 100

    VerifyRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: "^[0-9]{6}$"

    ResendRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    SessionResponse:
      type: object
      required: [access_token, expires_in_seconds]
      properties:
        access_token:
          type: string
        expires_in_seconds:
          type: integer

    User:
      type: object
      required: [id, email, display_name, email_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    AddSongRequest:
      type: object
      description: >
        multipart/form-data. source_type selects the branch: `file` is
        required and `artist` optional for `upload`; `youtube_url` is
        required for `youtube` (title then falls back to the video's own
        title if omitted).
      required: [source_type]
      properties:
        source_type:
          type: string
          enum: [upload, youtube]
        title:
          type: string
          maxLength: 200
          description: Required for source_type=upload; optional override for youtube.
        artist:
          type: string
          maxLength: 200
        file:
          type: string
          format: binary
          description: Required for source_type=upload. mp3/wav/m4a/flac/ogg, checked by magic bytes.
        youtube_url:
          type: string
          maxLength: 2048
          description: Required for source_type=youtube. Must be a youtube.com/youtu.be link.

    Song:
      type: object
      required: [id, source_type, title, duration_sec, vocal_stem_processed, reused, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_type:
          type: string
          enum: [upload, youtube]
        title:
          type: string
        artist:
          type: string
        duration_sec:
          type: integer
        vocal_stem_processed:
          type: boolean
          description: Reference separation+transcription status (FR-14). False until stage E3.
        reused:
          type: boolean
          description: True if this submission deduplicated onto an existing song (spec 6.6, FR-13).
        created_at:
          type: string
          format: date-time

    EnqueueAnalysisRequest:
      type: object
      description: multipart/form-data.
      required: [song_id, recording]
      properties:
        song_id:
          type: string
          format: uuid
        recording:
          type: string
          format: binary
          description: The user's recording. mp3/wav/m4a/flac/ogg, checked by magic bytes, ≤ MAX_AUDIO_SECONDS.

    Analysis:
      type: object
      required: [id, song_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        song_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, done, failed, canceled]
        queue_position:
          type: integer
          description: 1-based position among currently queued jobs. Absent once no longer queued.
        current_stage:
          type: string
          description: Set by the worker once processing starts.
        error_code:
          type: string
        pitch_score:
          type: number
        rhythm_score:
          type: number
        vibrato_score:
          type: number
        breath_score:
          type: number
        dynamics_score:
          type: number
        timbre_score:
          type: number
        overall_score:
          type: number
          description: Weighted sum of the six aspect scores (spec 6.4), set by stage 11.
        feedback_text:
          type: string
          description: Readable per-aspect report with concrete advice (FR-32).
        scoring_version:
          type: string
          description: Which SCORING_WEIGHTS this analysis was scored under (spec 6.4).
        piano_roll:
          $ref: "#/components/schemas/PianoRoll"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    PianoRoll:
      type: object
      description: >-
        FR-31 overlay data: the user's pitch curve and the reference curve
        already resampled onto the user's own time grid, frame for frame, so
        the client never needs to redo the DTW alignment (spec 6.3.4/6.3.5)
        to draw the two curves together.
      required: [hop_seconds, user_hz, reference_hz, deviation_cents, off_pitch]
      properties:
        hop_seconds:
          type: number
          description: Seconds between consecutive frames; frame i's time is i * hop_seconds.
        user_hz:
          type: array
          items:
            type: number
            nullable: true
        reference_hz:
          type: array
          items:
            type: number
            nullable: true
        deviation_cents:
          type: array
          description: Signed cents deviation per frame, null wherever either side is unvoiced.
          items:
            type: number
            nullable: true
        off_pitch:
          type: array
          description: deviation_cents already thresholded against PIANO_ROLL_OFF_PITCH_CENTS.
          items:
            type: boolean

    ProgressPoint:
      type: object
      description: One dated overall_score sample for the FR-35 progress chart.
      required: [analysis_id, overall_score, created_at]
      properties:
        analysis_id:
          type: string
          format: uuid
        overall_score:
          type: number
        created_at:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 9457 application/problem+json body.
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable machine-readable error code; frontend localizes on this.
        request_id:
          type: string
