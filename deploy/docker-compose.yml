# AI Vocal Coach -- production stack (spec 5.3, 16.2).
# Bring-up: from the repo root, `cp .env.example .env`, fill it in, then
# `docker compose -f deploy/docker-compose.yml up -d`.
#
# python-worker is intentionally absent: it lands in stage E3 together with
# worker/. Adding an empty service pointing at a Dockerfile that doesn't
# exist yet would just break `up` for no benefit today.

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    read_only: true
    # Caddy needs to bind ports 80/443 (privileged) and its image's default
    # user is root; cap_drop + this single cap_add still meaningfully
    # restricts it far below an unrestricted root container.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      go-api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: Caddy's admin API binds IPv4 loopback only,
      # and Alpine's busybox wget doesn't fall back from IPv6 to IPv4 when
      # "localhost" resolves to ::1 first and that connection is refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    # Bounds the whole container -- Go process plus any spawned ffmpeg/yt-dlp
    # child (same cgroup) -- standing in for a per-process ulimit, which
    # os/exec cannot set for a child without a shell (spec 11.3, 5.3).
    deploy:
      resources:
        limits:
          memory: 512M
    tmpfs:
      - /tmp
    volumes:
      - audio-tmp:/data/audio-tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    read_only: true
    cap_drop: [ALL]
    # The official entrypoint starts as root to chown a fresh data volume,
    # then drops to the postgres user itself -- it needs these to do that.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    user: "999:1000"
    entrypoint: ["sh", "-c"]
    # Sessions/rate-limits/refresh tokens are fine to lose on restart, so
    # persistence is off; that means no volume is needed, just tmpfs.
    command: ["exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    env_file:
      - ../.env
    tmpfs:
      - /data
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    env_file:
      - ../.env
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../backups:/backups
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  audio-tmp:
