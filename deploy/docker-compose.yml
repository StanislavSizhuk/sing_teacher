# AI Vocal Coach -- production stack (spec 5.3, 16.2).
# Bring-up: from the repo root, `cp .env.example .env`, fill it in, then
# `docker compose -f deploy/docker-compose.yml up -d`.

services:
  caddy:
    # Builds from web/Dockerfile's final stage: Caddy's own image with the
    # built React SPA baked into /srv/www (ADR-0013) -- no separate web
    # container in production (spec 5.1: "одразу віддає статику React --
    # на один контейнер менше"). The caddy:2-alpine base is still pinned
    # by tag and digest, just inside that Dockerfile instead of here, the
    # same pattern go-api/python-worker already use for their base images.
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    read_only: true
    # Caddy needs to bind ports 80/443 (privileged) and its image's default
    # user is root; cap_drop + this single cap_add still meaningfully
    # restricts it far below an unrestricted root container.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      go-api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: Caddy's admin API binds IPv4 loopback only,
      # and Alpine's busybox wget doesn't fall back from IPv6 to IPv4 when
      # "localhost" resolves to ::1 first and that connection is refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    # Bounds the whole container -- Go process plus any spawned ffmpeg/yt-dlp
    # child (same cgroup) -- standing in for a per-process ulimit, which
    # os/exec cannot set for a child without a shell (spec 11.3, 5.3).
    deploy:
      resources:
        limits:
          memory: 512M
    tmpfs:
      - /tmp
    volumes:
      - audio-tmp:/data/audio-tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  python-worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    # NFR-07: worker peak RAM <= 6 GB (Demucs and Whisper are never
    # resident together, spec 6.5); this is the enforced ceiling, not just
    # a target -- an OOM here must not be able to take Postgres down with it.
    deploy:
      resources:
        limits:
          memory: 6G
    # Graceful shutdown finishes the current stage and saves progress
    # before exiting (spec 10.1); 120s covers the slowest single stage
    # (separate_reference, 300s timeout) with margin for a typical case.
    stop_grace_period: 120s
    tmpfs:
      - /tmp
    volumes:
      - audio-tmp:/data/audio-tmp
      - song-stems:/data/song-stems
      - model-weights:/data/model-weights
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # No HTTP server to probe (spec 5.2: no public port) -- a background
      # thread touches this file on an interval independent of job
      # progress, so a multi-minute stage in flight is never mistaken for
      # a hung process (worker.py's _heartbeat_loop).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,sys,time; p=pathlib.Path('/tmp/vocalcoach-worker-heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<30 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    read_only: true
    cap_drop: [ALL]
    # The official entrypoint starts as root to chown a fresh data volume,
    # then drops to the postgres user itself -- it needs these to do that.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    user: "999:1000"
    entrypoint: ["sh", "-c"]
    # Sessions/rate-limits/refresh tokens are fine to lose on restart, so
    # persistence is off; that means no volume is needed, just tmpfs.
    command: ["exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    env_file:
      - ../.env
    tmpfs:
      - /data
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    env_file:
      - ../.env
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../backups:/backups
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  audio-tmp:
  # Separate from audio-tmp deliberately: audio-tmp is swept by age (FR-43,
  # <=5min after processing), but a separated reference vocal stem is
  # cached for as long as its song row exists (spec 6.6, 7.2).
  song-stems:
  # Demucs/Whisper weights, fetched once and reused across restarts so the
  # worker never re-downloads them on every container start (spec 5.4).
  model-weights:
