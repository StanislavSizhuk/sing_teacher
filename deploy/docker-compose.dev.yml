# AI Vocal Coach -- local dev stack (spec 16.3): hot reload, mailhog instead
# of a real SMTP relay, and DB/Redis ports published so a local client can
# connect directly. Not hardened like docker-compose.yml -- this never faces
# the internet.
#
# Usage: from the repo root, `cp .env.example .env`, then:
#   docker compose -f deploy/docker-compose.dev.yml up
# Every setting below already has a working dev default, including
# GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET placeholders -- set real values in
# .env only if you actually need to exercise Google login end-to-end.

x-dev-env: &dev-env
  APP_BASE_URL: http://localhost:8080
  CORS_ALLOWED_ORIGIN: http://localhost:5173
  JWT_SECRET: dev-only-insecure-secret-do-not-use-in-production-000000
  POSTGRES_PASSWORD: dev-only-postgres-password
  REDIS_PASSWORD: dev-only-redis-password
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  SMTP_FROM: dev@localhost
  # config.Load() fails fast on an empty value (spec 12.1), so these need a
  # placeholder even when nobody is testing Google login -- the actual
  # Google OIDC discovery call only happens lazily, the first time
  # /auth/google is hit (internal/oauth.GoogleVerifier.ensureInit), so a
  # non-real value is harmless until then.
  GOOGLE_CLIENT_ID: dev-placeholder-client-id
  GOOGLE_CLIENT_SECRET: dev-placeholder-client-secret
  # Spec 11.4 requires this to default to false in *production* config --
  # that's .env.example/.env, untouched here. The dev stack never faces the
  # internet and exists specifically so this flow can be exercised locally,
  # so it is on by default here instead of silently 403-ing until someone
  # discovers the flag exists.
  FEATURE_YOUTUBE_IMPORT: "true"

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *dev-env
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command: ["exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - ../.env
    environment:
      <<: *dev-env
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI: view captured verification emails
      - "1025:1025" # SMTP

  # PO Token provider sidecar (ADR-0037). Same image as production, not
  # hardened like it (dev never faces the internet) -- go-api's apk-installed
  # dev yt-dlp has no plugin to actually use it (api/Dockerfile's dev stage),
  # so this exists here mainly so the compose wiring/config default matches
  # production and can be exercised (GET /ping) without a separate stack.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1@sha256:1aaa43a0ca72dfca6a6d2129a0fb4a23465c25adb1b043f8aff829a20825646b
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4416/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  go-api:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *dev-env
    ports:
      - "8080:8080"
    volumes:
      - ../api:/src
      - audio-tmp-dev:/data/audio-tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      pot-provider:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      # Browser-facing URL, not compose-internal: the SPA runs in the
      # developer's own browser, which reaches go-api via its published
      # host port, not the compose network (dev-env's CORS_ALLOWED_ORIGIN
      # above already allows this origin back).
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ../web:/src
      # Anonymous volume so the bind mount above doesn't shadow the image's
      # own node_modules with the host's -- Vite/esbuild/Rollup ship
      # platform-specific native binaries, and a glibc host's node_modules
      # cannot run against this image's musl (Alpine) node.
      - /src/node_modules
      # `npm run generate:api` reads ../api/openapi.yaml relative to /src
      # (spec 12.4's one-network-layer contract, generated from the API's
      # own source of truth) -- without this mount that path resolves to
      # nothing live inside the container, and generate:api either fails or
      # silently regenerates from whatever got copied in by hand once and
      # never updated again.
      - ../api/openapi.yaml:/api/openapi.yaml:ro
    depends_on:
      go-api:
        condition: service_started

  python-worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *dev-env
    volumes:
      - ../worker:/src
      # Anonymous volume so the bind mount above doesn't shadow the image's
      # own .venv with the host's -- the host's editable install records an
      # absolute host path (see uv's *.pth file) that doesn't exist inside
      # the container, which otherwise crash-loops on `no module named
      # vocalcoach` (same reasoning as web's /src/node_modules below).
      - /src/.venv
      - audio-tmp-dev:/data/audio-tmp
      - song-stems-dev:/data/song-stems
      - model-weights-dev:/data/model-weights
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-dev-data:
  audio-tmp-dev:
  song-stems-dev:
  model-weights-dev:
